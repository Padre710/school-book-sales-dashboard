.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}

.find{display:grid;gap:10px}

.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}

const custType=i=>CUS[INV[i].c].type;
function cur(){return INV.filter(r=>r.net!=null&&r.y>=S.y0&&r.y<=S.y1&&S.types.has(CUS[r.c].type))}
function curLines(inv){const ids=new Set(inv.map(r=>r.i));const out=[];ids.forEach(i=>{(LBI.get(i)||[]).forEach(l=>{if(S.title==='all'||TITLES[l.t]===S.title)out.push(l)})});return out}

<div class="grid">${card('Profit per year','Revenue next to gross profit (revenue less the cost of the copies sold).',cv('f1'),'line net revenue minus quantity times unit cost.')}
${card('Most profitable month',`${MONTHS[bm[0]]} earns the most gross profit (${fk(bm[1])}) over the selected years.`,cv('f2'),'gross profit summed by calendar month.')}
${card('Customers by profit','',table(['Customer','Revenue','Gross profit','Margin'],cus.map(r=>[r.n,fm(r.r),fm(r.p),pc(r.p,r.r)])),'')}
${card('Titles by profit','',table(['Title','Revenue','Gross profit','Margin'],tt.map(r=>[r.n,fm(r.r),fm(r.p),pc(r.p,r.r)])),'')}</div>`};
pages.story=()=>{const A=INV.filter(r=>r.net!=null);const by=group(A,r=>r.y);const ys=[...by.keys()].sort();const R=y=>sum(by.get(y),x=>x.net),B=y=>sum(by.get(y),x=>x.books);
const tot=sum(A,r=>r.net);const mt=Array.from({length:12},(_,m)=>sum(A.filter(r=>r.m===m+1),x=>x.net));const mr=mt.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]);
const cb=group(A,r=>r.c);const cr=[...cb.entries()].map(([c,a])=>[c,sum(a,x=>x.net),a.length,new Set(a.map(x=>x.y)).size]).sort((a,b)=>b[1]-a[1]);
const top10=sum(cr.slice(0,10),x=>x[1]);const loyal=cr.filter(x=>x[3]>=4).length;
const tm=group(A,r=>CUS[r.c].type);const sch=sum(tm.get('School')||[],x=>x.net),bkp=sum(tm.get('Bookshop')||[],x=>x.net);
const sus=TITLES.indexOf('Book 03');const sp=y=>{const a=LIN.filter(l=>l.t===sus&&l.p&&INV[l.inv].y===y).map(l=>l.p),c=new Map();a.forEach(p=>c.set(p,(c.get(p)||0)+1));return [...c.entries()].sort((a,b)=>b[1]-a[1])[0]};
const p0=sp(ys[0]),p1=sp(ys[ys.length-1]);const dsc=pc(sum(A,r=>r.disc),sum(A,r=>r.gross));
const big=[...A].sort((a,b)=>b.net-a.net)[0];const tr=RANK[0];const best=[...ys].sort((a,b)=>R(b)-R(a))[0];
const F=[
[`${ys[0]} to ${ys[ys.length-1]}: ${fn(A.length)} invoices and ${fk(tot)} of revenue`,`Revenue was highest in ${best} (${fk(R(best))}). The data runs from ${P.data_start} to ${P.data_end}.`,'overview'],
[`Two months do most of the work`,`${MONTHS[mr[0][1]]} (${pc(mr[0][0],tot,0)}) and ${MONTHS[mr[1][1]]} (${pc(mr[1][0],tot,0)}) are ${pc(mr[0][0]+mr[1][0],tot,0)} of all revenue: the new school year. ${MONTHS[mr[11][1]]} is the quietest month (${pc(mr[11][0],tot,1)}).`,'months'],
[`Fewer, bigger orders`,`Invoices fell from ${by.get(ys[0]).length} in ${ys[0]} to ${by.get(ys[ys.length-1]).length} in ${ys[ys.length-1]}, while the average invoice rose from ${fm(R(ys[0])/by.get(ys[0]).length)} to ${fm(R(ys[ys.length-1])/by.get(ys[ys.length-1]).length)}.`,'overview'],
[`Prices did most of the growth`,p0&&p1?`Book 03 went from ${fm(p0[0])} to ${fm(p1[0])} a copy (${(p1[0]/p0[0]).toFixed(1)} times). Books sold: ${fn(B(ys[0]))} in ${ys[0]}, ${fn(B(ys[ys.length-1]))} in ${ys[ys.length-1]} (the last year is partial).`:'','books'],
[`A spread-out customer base`,`${fn(cr.length)} customers. The top 10 are ${pc(top10,tot,0)} of revenue. ${fn(loyal)} customers bought in 4 or more different years.`,'customers'],
[`Schools are the business`,`Schools bring ${pc(sch,tot,0)} of revenue and bookshops ${pc(bkp,tot,0)}.`,'customers'],
[`The most important customer`,`${CUS[cr[0][0]].name}: ${fk(cr[0][1])} over ${cr[0][2]} invoices in ${cr[0][3]} different years. The single biggest order was ${fm(big.net)} (${CUS[big.c].name}, ${big.d}).`,'customers'],
[`The best-selling book`,`${TITLES[tr]} earns the most revenue over the years.`,'books'],
[`Discounts are small`,`${dsc} of the gross value was given away as discount.`,'prices'],
[`2020 was the COVID year`,`Schools were closed: only ${by.get(2020)?by.get(2020).length:'-'} invoices in 2020 against ${by.get(2019)?by.get(2019).length:'-'} in 2019, and revenue fell to ${fk(R(2020))} from ${fk(R(2019))}. In 2021 schools reopened: ${by.get(2021)?by.get(2021).length:'-'} invoices and ${fk(R(2021))}.`,'overview']];
return `<div class="note">These sentences are written from the numbers each time the dashboard is built, so they never go stale. They cover all years and all customers (the filters above do not apply here). Revenue is what was paid; profit appears once the cost file is added.</div>
<div class="card find">${F.filter(f=>f[1]).map((f,i)=>`<div class="f"><div class="num">${i+1}</div><div><b>${f[0]}</b><div class="sub">${f[1]} <button class="btn" data-go="${f[2]}">See the chart</button></div></div></div>`).join('')}</div>`};
pages.trust=()=>{const T=P.trust;const yy=group(INV,r=>r.y);
return `<div class="cards">${kpi('Invoices',fn(P.totals.invoices),fn(P.totals.lines)+' book lines')}${kpi('You checked',T.pct+'%',T.asked+' of '+T.of+' invoices (2019-2026 without 2021)')}${kpi('For comparison',T.reviewed2021+'%','of 2021, checked by hand')}${kpi('Rules built',T.rules,'each one cleared invoices automatically')}</div>
<div class="grid">${card('How the data was made','',`<ul><li>Every invoice photo was read by Gemini into a spreadsheet, then read again by independent readers who never saw the spreadsheet.</li><li>A set of ${T.rules} written rules cleaned and checked it; only what the rules could not settle went to the owner.</li><li>A final review checked every photo against the data: no photo counted twice, printed numbers, arithmetic, dates against the numbering, prices.</li><li>Every decision has a record: who decided, what, why.</li></ul>`)}
${card('The numbers reconcile','Each table was checked against the invoices file before this page was built.',table(['Check','Result'],P.checks.map(c=>[c[0],`<span class="pill ${c[3]==='OK'?'ok':'fail'}">${c[3]}</span> ${fn(c[1])}`])),'')}</div>
${card('Read this before quoting a number','',`<ul><li><b>Revenue, not profit:</b> ${P.cost.method?'cost source: '+P.cost.note:'the cost of the books is not in the data yet'}.</li><li>Returns and refunds written on a few papers are not recorded: revenue is slightly overstated.</li><li>Only the papers that were photographed are here: some invoice numbers are missing in every year.</li><li>16 invoices have lines that do not add up to the total written on the paper (the owner's own arithmetic); they are listed in the final review and kept as written.</li><li>Prices are in naira of the day; they rose about 2.8 times from 2019 to 2026, so compare books sold as well as revenue.</li><li>2019 starts on ${P.data_start}; 2026 stops on ${P.data_end}.</li></ul>`)}`};
/* ---------- chrome */
const TABS=[['overview','Overview'],['months','Months'],['customers','Customers'],['books','Books'],['prices','Prices & discounts'],['orders','Orders'],['profit','Profit'],['story','Story'],['trust','Data trust']];
function render(){killCharts();$('#main').innerHTML=pages[S.tab]();$('#titlebox').hidden=!(S.tab==='books');
$('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" ${k===S.tab?'aria-current="true"':''}>${l}</button>`).join('');
const fl=S.tab==='story'||S.tab==='trust';document.querySelector('.filters').style.display=fl?'none':'flex';
document.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>{S.rankBy=b.dataset.rank;render()});
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
try{history.replaceState(null,'','#'+S.tab)}catch(e){}}
function go(t){S.tab=t;render();window.scrollTo(0,0)}
function init(){
$('#sub').textContent=`${P.totals.invoices} invoices, ${P.totals.books.toLocaleString('en-US')} books, ${P.data_start} to ${P.data_end}. Revenue is what was paid, in naira.`;
$('#gen').textContent='Built '+P.generated;
const opts=YEARS.map(y=>`<option>${y}</option>`).join('');$('#y0').innerHTML=opts;$('#y1').innerHTML=opts;$('#y0').value=S.y0;$('#y1').value=S.y1;
$('#y0').onchange=e=>{S.y0=+e.target.value;if(S.y1<S.y0)S.y1=S.y0,$('#y1').value=S.y1;render()};
$('#y1').onchange=e=>{S.y1=+e.target.value;if(S.y0>S.y1)S.y0=S.y1,$('#y0').value=S.y0;render()};
$('#title').innerHTML='<option value="all">All books</option>'+TITLES.filter(t=>!NONBOOK.has(t)).map(t=>`<option>${t}</option>`).join('');$('#title').onchange=e=>{S.title=e.target.value;render()};
function chips(){$('#types').innerHTML=TYPES.map(t=>`<button class="chip" data-type="${t}" aria-pressed="${S.types.has(t)}"><i style="background:var(${TVAR[t]})"></i>${t}</button>`).join(' ');
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{const t=b.dataset.type;if(S.types.has(t)){if(S.types.size>1)S.types.delete(t)}else S.types.add(t);chips();render()})}
chips();
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});
$('#foot').textContent=P.public?'Source: the processed data of this project (data/processed). Every table behind a chart is in analysis/tables.':'Source: DATA_FINAL/3_analysis_ready and 6_customer_master. Built by 0_AUTOMATION/build_dashboard.py. Every table behind a chart is in DATA_FINAL/7_kpi_tables.';
const h=(location.hash||'').slice(1);if(pages[h])S.tab=h;
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
render()}
init();
})();
</script>
